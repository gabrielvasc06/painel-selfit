# Adicione este arquivo somente quando o MySQL tambem sera gerenciado pelo Compose.
services:
  app:
    depends_on:
      db:
        condition: service_healthy
  migrate:
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?Defina DB_DATABASE}
      MYSQL_USER: ${DB_USER:?Use um usuario exclusivo da aplicacao}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD diferente de DB_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql -h 127.0.0.1 -u "$${MYSQL_USER}" -D "$${MYSQL_DATABASE}" -e "SELECT 1" >/dev/null 2>&1']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
volumes:
  mysql-data:
