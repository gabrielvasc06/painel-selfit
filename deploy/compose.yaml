x-runtime: &runtime
  image: painel-selfit:${IMAGE_TAG:-local}
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  environment:
    NODE_ENV: production
    HOST: 0.0.0.0
    PORT: 3000
    DB_HOST: ${DB_HOST:?Defina DB_HOST}
    DB_PORT: ${DB_PORT:-3306}
    DB_DATABASE: ${DB_DATABASE:?Defina DB_DATABASE}
    DB_USER: ${DB_USER:?Defina DB_USER}
    DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD}
    JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET aleatorio}
    FRONT: ${FRONT:?Defina a origem publica do painel}
    ACCESS_ALLOWED_CIDRS: ${ACCESS_ALLOWED_CIDRS:?Defina as redes autorizadas}
    ACCESS_ALLOWED_USERS: ${ACCESS_ALLOWED_USERS:?Defina os usuarios da TI autorizados}
    USER_ADMIN_USERS: ${USER_ADMIN_USERS:-}
    TRUST_PROXY: ${TRUST_PROXY:-}
    DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
    DB_SSL: ${DB_SSL:-false}
    DB_SSL_CA_FILE: ${DB_SSL_CA_FILE:-}
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=16m,mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options:
      max-size: '10m'
      max-file: '3'

services:
  app:
    <<: *runtime
    restart: unless-stopped
    # Padrao acessivel somente pelo proxy do proprio servidor.
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:3000'
    stop_grace_period: 30s
  migrate:
    <<: *runtime
    profiles: [tools]
    restart: 'no'
    command: ['npm', '--prefix', 'api-selfit', 'run', 'migrate', '--', '--env', 'production']
    healthcheck:
      disable: true
  db:
    profiles: [database]
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?Defina DB_DATABASE}
      MYSQL_USER: ${DB_USER:?Use um usuario exclusivo da aplicacao}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql -h 127.0.0.1 -u "$${MYSQL_USER}" -D "$${MYSQL_DATABASE}" -e "SELECT 1" >/dev/null 2>&1']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
volumes:
  mysql-data:
